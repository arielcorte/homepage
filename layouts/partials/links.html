{{/* Elsewhere links: site.Params.links plus the email address, which also gets a copy button on hover. */}}
{{ range site.Params.links }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}
{{ with site.Params.email }}<span class="email"><a href="mailto:{{ . }}">{{ . }}</a><button type="button" class="copy" data-copy="{{ . }}" aria-label="Copy email address"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v6A1.5 1.5 0 0 0 4 10.5h.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="done" role="status"></span></button></span>{{ end }}
