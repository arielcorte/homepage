baseURL = "https://arielcorte.com/"
languageCode = "en-us"
title = "Ariel Corte"

# Taxonomies aren't used; skip generating empty /tags and /categories pages.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Ariel Corte"
  author = "Ariel Corte"
  # Square photo under static/.
  avatar = "avatar.jpg"
  # GitHub username for the "year in commits" graph. Remove to hide it.
  github = "arielcorte"
  # Optional line at the end of each post.
  # signoff = ""
  # Optional; adds an Email link next to GitHub and X.
  email = "ariel@arielcorte.com"
  # GoatCounter site code (CODE.goatcounter.com) for visit counts. Remove to turn analytics off.
  goatcounter = "arielcorte"

  # Optional label/value list under your photo on the home page, above the links. Add your own:
  # [[params.colophon]]
  #   term = "Label"
  #   value = "Value"

  [[params.links]]
    name = "GitHub"
    url = "https://github.com/arielcorte"
  [[params.links]]
    name = "X"
    url = "https://x.com/arielcorte_"

# Refetch the GitHub contribution graph at most twice a day when building locally.
[caches.getresource]
  dir = ":cacheDir/:project"
  maxAge = "12h"

[markup.goldmark.renderer]
  unsafe = true

# Lets the image render hook turn standalone images into captioned figures.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  noClasses = false
